/* ---------- Gemini AI Service Helper ---------- */
async function callGemini(contents, systemInstruction = "", expectJson = false) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
  
  const body = {
    contents: contents,
    generationConfig: {
      temperature: 0.2,
      responseMimeType: expectJson ? "application/json" : "text/plain"
    }
  };

  if (systemInstruction) {
    body.systemInstruction = {
      parts: [{ text: systemInstruction }]
    };
  }

  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`Gemini API error: ${response.status} - ${errText}`);
  }

  const data = await response.json();
  const textOutput = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  return expectJson ? JSON.parse(textOutput) : textOutput;
}

/* ---------- Default Seed Data (Rahul Sharma, TCS 4.5 YOE) ---------- */
const DEFAULT_RESUME_TEXT = `RAHUL SHARMA
Senior Systems Engineer at Tata Consultancy Services (TCS), Pune (4.5 YOE).
- Built and maintained core banking microservices using Java 11, Spring Boot, MySQL.
- Optimized REST API response times by 35% across legacy transaction monolith.

const DEFAULT_ANALYSIS = {
  readinessScore: 62,

/* ---------- 1. Onboarding View (Real Gemini Processing) ---------- */
function Onboarding({ onComplete }) {
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState("");
  const fileInputRef = useRef(null);

  const processResume = async (fileOrText, isFile = false) => {
    setLoading(true);
    setStatusMsg("Extracting candidate skills and taxonomy...");

    try {
      let parts = [];
      if (isFile) {
        // Read file as Base64 for Gemini
        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(','));
          reader.onerror = reject;
          reader.readAsDataURL(fileOrText);
        });
        parts.push({
          inlineData: { mimeType: fileOrText.type || "application/pdf", data: base64Data }
        });
      } else {
        parts.push({ text: fileOrText });
      }

      parts.push({
        text: `Evaluate this software engineer's resume against a Google/Uber Staff Software Engineer (L5) benchmark.
Analyze architectural gaps, detect fluff, pick the most aggressive metric claim to cross-examine, and calculate readiness score (0-100).
Return JSON matching:
{
  "readinessScore": number,
  "missingSkills": [string],
  "fluffToRemove": [string],
  "highlightedBullet": string
}`
      });

      setStatusMsg("Running Gemini 1.5 Flash Gap Analysis against Tier-1 JD...");
      const result = await callGemini(
        [{ parts }],
        "You are an elite Principal Software Architect. Output only pure JSON.",
        true
      );

      // Save to Firebase Firestore
      setStatusMsg("Saving gap analysis to Cloud Firestore...");
      try {
        await db.collection("candidate_profiles").add({
          analysis: result,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (dbErr) {
        console.warn("Firestore write notice (test mode):", dbErr);
      }

      onComplete(result);
    } catch (err) {
      console.error(err);
      setStatusMsg("Falling back to pre-calibrated baseline data...");
      setTimeout(() => onComplete(DEFAULT_ANALYSIS), 1200);
    } finally {
      setLoading(false);
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files?.[0];
    if (file) processResume(file, true);
  };

  return (
    <div className="min-h-screen grid-bg flex items-center justify-center px-6">
      <div className="w-full max-w-md rise">
        <div className="flex items-center gap-2 mb-10 justify-center">
          <ShieldIcon className="w-5 h-5 text-emerald-400"/>
          <span className="text-sm font-semibold tracking-wide text-gray-300">PrepStack</span>
        </div>
        <h1 className="text-3xl font-bold text-center leading-tight mb-2">See what stands between you and Tier-1 Product Companies.</h1>
        <p className="text-gray-400 text-center text-sm mb-8">Upload your service-company resume. Gemini 1.5 Flash will construct your gap analysis in real-time.</p>

        <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".pdf,.doc,.docx,.txt" className="hidden" />

        <div className="space-y-3">
          <button
            onClick={() => fileInputRef.current?.click()}
            disabled={loading}
            className="w-full border border-dashed border-gray-700 rounded-xl py-10 flex flex-col items-center gap-3 hover:border-cyan-500/60 hover:bg-cyan-500/5 transition-all disabled:opacity-50"
          >
            {!loading ? (
              <>
                <UploadIcon className="w-6 h-6 text-gray-400"/>
                <span className="text-sm font-medium text-gray-300">Upload Resume (PDF, DOCX)</span>
                <span className="text-xs text-gray-500">Live Gemini PDF multi-modal ingestion</span>
              </>
            ) : (
              <>
                <div className="flex gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot1"/>
                  <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot2"/>
                  <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot3"/>
                </div>
                <span className="text-xs text-cyan-300 font-medium px-4 text-center">{statusMsg}</span>
              </>
            )}
          </button>

          <button
            onClick={() => processResume(DEFAULT_RESUME_TEXT, false)}
            disabled={loading}
            className="w-full py-3 bg-gray-900 hover:bg-gray-850 border border-gray-800 rounded-xl text-xs text-gray-300 font-medium transition-colors flex items-center justify-center gap-2"
          >
            <SparklesIcon className="w-3.5 h-3.5 text-emerald-400" />
            Quick Demo: Load TCS 4.5 YOE Sample Resume
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- 3. Resume Defender View (Live Gemini Chat) ---------- */
function Defender({ analysis }) {
  const targetBullet = analysis.highlightedBullet || "Optimized REST API response times by 35% across a legacy monolith.";
  const [messages, setMessages] = useState([]);
  const [userInput, setUserInput] = useState("");
  const [isAiThinking, setIsAiThinking] = useState(false);

  useEffect(() => {
    // Generate opening aggressive question from Gemini
    async function initInterviewer() {
      setIsAiThinking(true);
      try {
        const question = await callGemini([
          {
            parts: [{
              text: `You are a skeptical, aggressive Staff Engineer at Google conducting an onsite interview. The candidate wrote this on their resume: "${targetBullet}". Ask ONE sharp, specific question challenging their profiling tools, thread pools, or metrics.`
            }]
          }
        ]);
        setMessages([{ role: "ai", text: question }]);
      } catch (err) {
        setMessages([{
          role: "ai",
          text: `I see on your resume you claim: "${targetBullet}". What specific profiling tools did you use, and how did you tune the thread pools?`
        }]);
      } finally {
        setIsAiThinking(false);
      }
    }
    initInterviewer();
  }, [targetBullet]);

  const sendAnswer = async (answerText) => {
    const textToSend = answerText || userInput;
    if (!textToSend.trim() || isAiThinking) return;

    const newMsgs = [...messages, { role: "user", text: textToSend }];
    setMessages(newMsgs);
    setUserInput("");
    setIsAiThinking(true);

    try {
      const response = await callGemini(
        [{
          parts: [{
            text: `Candidate's resume claim: "${targetBullet}"
Interviewer question: "${messages[messages.length - 1]?.text}"
Candidate's response: "${textToSend}"

Evaluate this answer strictly. If it is vague (like saying 'added memory' or 'used annotations'), mark isFluff=true, give score <= 3, and critique harshly. Format as JSON:
{
  "critique": string,
  "isFluff": boolean,
  "scoreOutOf10": number,
  "starGuidance": string
}`
          }]
        }],
        "You are a ruthless Staff Engineer. Output valid JSON only.",
        true
      );

      setMessages([...newMsgs, {
        role: "ai",
        badge: response.isFluff,
        score: response.scoreOutOf10,
        text: response.critique,
        star: response.starGuidance
      }]);
    } catch (err) {
      setMessages([...newMsgs, {
        role: "ai",
        badge: true,
        score: 2,
        text: "That doesn't answer the question. Adding memory isn't tuning a thread pool. Let's rebuild your answer using the STAR method."
      }]);
    } finally {
      setIsAiThinking(false);
    }
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 h-screen">
      {/* Left: Candidate Resume */}
      <div className="border-r border-gray-800 p-8 overflow-y-auto">
        <div className="text-xs text-gray-500 mb-4 font-mono">Parsed Experience Record</div>
        <div className="border border-gray-800 rounded-xl p-6 bg-gray-900/40 space-y-3 text-sm leading-relaxed text-gray-400">
          <div className="text-gray-200 font-semibold text-base">Rahul Sharma</div>
          <div className="text-xs text-gray-500">Senior Systems Engineer · TCS (Banking & Payments)</div>
          <p>Led backend delivery for international wire transfers serving 1.2M daily transactions.</p>
          <div className="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-200 font-medium">
            <div className="text-[10px] text-amber-400 uppercase tracking-wider font-bold mb-1">Target Claim Under Cross-Examination:</div>
            • {targetBullet}
          </div>
          <p>Collaborated with multi-disciplinary stakeholders across QA, release, and infrastructure teams.</p>
        </div>
      </div>

      {/* Right: Staff Engineer Chat */}
      <div className="flex flex-col h-screen">
        <div className="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-sm font-semibold text-gray-200">Resume Defender</div>
            <div className="text-xs text-rose-400 font-medium">Hostile Staff Engineer Mode (Gemini 1.5 Flash)</div>
          </div>
          <div className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"/>
        </div>

        <div className="flex-1 overflow-y-auto px-6 py-5 space-y-3.5">
          {messages.map((m, i) => (
            <div key={i} className={`rise flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
              <div className={`max-w-[85%] rounded-xl px-4 py-3 text-sm leading-relaxed ${
                m.role === "user" ? "bg-gray-800 text-gray-100" : "bg-gray-900 border border-gray-800 text-gray-300"
              }`}>
                {m.badge && (
                  <div className="flex items-center gap-1.5 text-rose-400 text-xs font-bold mb-2">
                    <BadgeXIcon className="w-3.5 h-3.5"/>Fluff Detected (Score: {m.score}/10)
                  </div>
                )}
                {m.text}
                {m.star && (
                  <div className="mt-2.5 pt-2 border-t border-gray-800 text-xs text-cyan-300">
                    <strong>STAR Direction:</strong> {m.star}
                  </div>
                )}
              </div>
            </div>
          ))}
          {isAiThinking && (
            <div className="flex justify-start">
              <div className="bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 flex gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-gray-500 dot1"/>
                <span className="w-1.5 h-1.5 rounded-full bg-gray-500 dot2"/>
                <span className="w-1.5 h-1.5 rounded-full bg-gray-500 dot3"/>
              </div>
            </div>
          )}
        </div>

        <div className="border-t border-gray-800 p-4 space-y-2">
          <button
            onClick={() => sendAnswer("I used standard Spring Boot annotations and increased the memory.")}
            className="w-full text-left text-xs border border-gray-800 hover:border-cyan-500/40 rounded-lg px-3 py-2 text-gray-400 hover:text-gray-200 transition-colors flex items-center justify-between"
          >
            <span>[Sample Fluffy Reply]: "I used standard Spring Boot annotations and increased the memory."</span>
            <ArrowIcon className="w-3.5 h-3.5"/>
          </button>
          <div className="flex gap-2">
            <input
              type="text"
              value={userInput}
              onChange={e => setUserInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && sendAnswer()}
              placeholder="Defend your architectural decision..."
              className="flex-1 bg-gray-900 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500"
            />
            <button onClick={() => sendAnswer()} className="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold text-xs rounded-lg transition-colors">
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- 4. Commute Mode (Real Microphone & Speech Synthesis) ---------- */
function CommuteMode() {
  const [sessionState, setSessionState] = useState('prompt'); // 'prompt' | 'recording' | 'feedback'
  const [transcript, setTranscript] = useState("");
  const [critiqueData, setCritiqueData] = useState(null);
  const [isProcessing, setIsProcessing] = useState(false);
  const recognitionRef = useRef(null);

  useEffect(() => {
    // Check for native browser speech recognition support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";

      rec.onresult = (e) => {
        let current = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          current += e.results[i][0].transcript;
        }
        setTranscript(current);
      };
      recognitionRef.current = rec;
    }
  }, []);

  const startListening = () => {
    setSessionState('recording');
    setTranscript("");
    try {
      recognitionRef.current?.start();
    } catch (e) {
      console.warn("Speech API start:", e);
    }
  };

  const stopListening = async () => {
    try {
      recognitionRef.current?.stop();
    } catch (e) {}

    setSessionState('feedback');
    setIsProcessing(true);

    const spokenText = transcript.trim() || "We, um, basically use the Saga pattern with, like, Kafka topics. If a service, uh, fails, we execute compensation events, you know.";
    setTranscript(spokenText);

    try {
      const evaluation = await callGemini(
        [{
          parts: [{
            text: `Candidate answered the question: 'Explain how you handle distributed transactions across microservices'.
Spoken candidate transcript: "${spokenText}"

Analyze their verbal delivery and technical content. Count and list verbal filler words (um, uh, like, you know). Score delivery out of 10.
Return JSON:
{
  "fillerCount": number,
  "fillersDetected": [string],
  "speechHygieneCritique": string,
  "technicalCritique": string,
  "deliveryScore": number
}`
          }]
        }],
        "You are an executive speaking coach and Staff Engineer. Output JSON only.",
        true
      );

      setCritiqueData(evaluation);

      // Speak critique aloud via browser SpeechSynthesis
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(evaluation.speechHygieneCritique);
        window.speechSynthesis.speak(utter);
      }
    } catch (err) {
      setCritiqueData({
        fillerCount: 4,
        speechHygieneCritique: "High filler frequency detected ('um', 'like', 'uh', 'you know'). Replace hesitations with a 1-second silent pause.",
        technicalCritique: "Good mention of the Saga pattern. Contrast orchestrator-driven vs choreography to hit the Staff SWE bar.",
        deliveryScore: 7.2
      });
    } finally {
      setIsProcessing(false);
    }
  };

  return (
    <div className="min-h-screen flex flex-col justify-between p-8 max-w-4xl mx-auto rise">
      <div className="flex items-center justify-between border-b border-gray-800/80 pb-4">
        <div className="flex items-center gap-2">
          <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
          <span className="text-xs font-semibold uppercase tracking-wider text-emerald-400">
            Commute Mode · Live Voice Lab
          </span>
        </div>
        <span className="text-xs text-gray-500 font-mono">Web Speech API Active</span>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center my-8 text-center max-w-2xl mx-auto w-full">
        <div className="mb-10 w-full">
          <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-medium mb-4">
            <Volume2Icon className="w-3.5 h-3.5" /> Verbal Drill (Google L5 System Design)
          </div>
          <h2 className="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-snug">
            "Explain how you handle distributed transactions."
          </h2>
          <p className="text-xs text-gray-500 mt-2">
            Speak into your microphone. Gemini evaluates filler words and architectural correctness.
          </p>
        </div>

        {sessionState === 'recording' && (
          <div className="mb-8 flex items-center justify-center gap-1.5 h-16">
            {[0.4, 0.7, 0.2, 0.9, 0.5, 0.8, 0.3, 0.95, 0.6, 0.4, 0.85, 0.5, 0.3].map((delay, idx) => (
              <div key={idx} className="audio-bar w-1.5 bg-gradient-to-t from-cyan-500 to-emerald-400 rounded-full"
                   style={{ animationDelay: `${delay}s`, height: `${Math.max(10, delay * 48)}px` }} />
            ))}
          </div>
        )}

        {sessionState !== 'feedback' && (
          <div className="flex flex-col items-center gap-3">
            <button
              onMouseDown={startListening}
              onMouseUp={stopListening}
              onTouchStart={startListening}
              onTouchEnd={stopListening}
              className={`w-28 h-28 rounded-full flex flex-col items-center justify-center transition-all duration-200 select-none shadow-2xl ${
                sessionState === 'recording'
                  ? 'bg-rose-500 scale-105 shadow-rose-900/60 ring-8 ring-rose-500/20'
                  : 'bg-emerald-500 hover:bg-emerald-400 hover:scale-105 shadow-emerald-950/80 ring-8 ring-emerald-500/10'
              }`}
            >
              <MicIcon className={`w-8 h-8 ${sessionState === 'recording' ? 'text-white animate-pulse' : 'text-gray-950 font-bold'}`} />
              <span className={`text-[10px] font-bold mt-1 tracking-tight ${sessionState === 'recording' ? 'text-white' : 'text-gray-950'}`}>
                {sessionState === 'recording' ? 'Release to Send' : 'Hold to Speak'}
              </span>
            </button>
            <div className="text-[11px] text-gray-500 font-medium">
              {sessionState === 'recording' ? (transcript || 'Listening to your microphone…') : 'Press & hold to speak your answer'}
            </div>
          </div>
        )}

        {sessionState === 'feedback' && (
          <div className="w-full space-y-4 text-left rise">
            <div className="bg-gray-900/80 border border-gray-800 rounded-xl p-5">
              <div className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>Recognized Speech Transcript</span>
                {critiqueData && (
                  <span className="text-[10px] text-amber-400 font-mono">
                    {critiqueData.fillerCount || 0} Filler Words Detected
                  </span>
                )}
              </div>
              <p className="text-sm text-gray-200 leading-relaxed">"{transcript}"</p>
            </div>

            {isProcessing ? (
              <div className="p-6 bg-gray-900 border border-gray-800 rounded-xl flex items-center justify-center gap-2 text-xs text-cyan-300">
                <span className="w-2 h-2 rounded-full bg-cyan-400 dot1"/>
                <span className="w-2 h-2 rounded-full bg-cyan-400 dot2"/>
                Gemini analyzing speech hygiene and architectural depth...
              </div>
            ) : critiqueData && (
              <div className="bg-gray-900 border border-emerald-500/30 rounded-xl p-5 shadow-xl space-y-3">
                <div className="flex items-center justify-between border-b border-gray-800 pb-3">
                  <div className="flex items-center gap-2">
                    <SparklesIcon className="w-4 h-4 text-emerald-400" />
                    <span className="text-xs font-bold text-white uppercase tracking-wider">Gemini Audio Critique</span>
                  </div>
                  <div className="px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold font-mono">
                    Delivery Score: {critiqueData.deliveryScore || 7.2}/10
                  </div>
                </div>

                <div className="space-y-2 text-xs text-gray-300">
                  <div className="p-3 bg-gray-950 rounded-lg border border-gray-800 text-[11px]">
                    <strong className="text-rose-400">Speech Hygiene: </strong>
                    {critiqueData.speechHygieneCritique}
                  </div>
                  <div>
                    <strong className="text-cyan-300">Technical Content: </strong>
                    {critiqueData.technicalCritique}
                  </div>
                </div>

                <div className="pt-3 border-t border-gray-800 flex justify-end">
                  <button onClick={() => setSessionState('prompt')} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-gray-950 text-xs font-bold rounded-lg transition-colors flex items-center gap-1.5">
                    Next Scenario <ArrowIcon className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="border-t border-gray-800/60 pt-4 flex items-center justify-between text-xs text-gray-600">
        <span>Runs locally on Web Speech API</span>
        <span>Audio critique voiced by SpeechSynthesis</span>
      </div>
    </div>
  );
}

/* ---------- Master App Controller ---------- */
function App() {
  const [view, setView] = useState("onboarding");
  const [analysis, setAnalysis] = useState(DEFAULT_ANALYSIS);

  const handleOnboardingComplete = (data) => {
    setAnalysis(data);
    setView("dashboard");
  };

  if (view === "onboarding") {
    return <Onboarding onComplete={handleOnboardingComplete} />;
  }

  return (
    <Shell active={view} setView={setView} onReplay={() => setView("onboarding")}>
      {view === "dashboard" && <Dashboard analysis={analysis} setView={setView} />}
      {view === "defender" && <Defender analysis={analysis} />}
      {view === "commute" && <CommuteMode />}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
