/* ---------- Bulletproof Type Normalizers ---------- */
function safeArray(val, fallback = []) {
  if (Array.isArray(val)) return val.filter(Boolean);
  if (typeof val === 'string' && val.trim().length > 0) {
    return val.split(',').map(s => s.trim().replace(/^[-•*\d.]+\s*/, '')).filter(Boolean);
  }
  return fallback;
}

function cleanJsonParse(text) {
  if (!text) return null;
  let cleaned = String(text).trim();
  if (cleaned.startsWith("```")) {
    cleaned = cleaned.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "");
  }
  return JSON.parse(cleaned);
}

function getTodayString() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
}

function normalizeAnalysis(raw) {

/* ---------- Resilient Gemini AI Caller ---------- */
async function callGemini(contents, systemInstruction = "", expectJson = false) {
  const url = "[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=)" + encodeURIComponent(GEMINI_API_KEY);
  const body = {
    contents: contents,
    generationConfig: {
      temperature: 0.25,
      responseMimeType: expectJson ? "application/json" : "text/plain"
    }
  };
  if (systemInstruction) {
    body.systemInstruction = { parts: [{ text: systemInstruction }] };
  }
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error("Gemini error: " + response.status + " - " + errText);
  }
  const data = await response.json();
  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  return expectJson ? cleanJsonParse(rawText) : rawText;
}

/* ---------- 1. Error Boundary ---------- */
class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.warn("PrepStack caught UI error:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-[#05070d] flex items-center justify-center p-6 text-center">
          <div className="max-w-md bg-[#090d18] border border-slate-800 rounded-2xl p-8 space-y-4">

function PracticeMode({ analysis, onCompleteSprint }) {
  const norm = normalizeAnalysis(analysis);
  const [techList, setTechList] = useState(norm.detectedTechs);
  const [selectedTech, setSelectedTech] = useState(norm.detectedTechs[0] || "Java");
  const [difficulty, setDifficulty] = useState("easy");
  const [round, setRound] = useState(1);
  const [newTech, setNewTech] = useState("");

  const [currentIdx, setCurrentIdx] = useState(0);
  const [selectedAnswers, setSelectedAnswers] = useState({});
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [questions, setQuestions] = useState([]);
  const [loadingQs, setLoadingQs] = useState(false);

  useEffect(() => {
    async function loadDynamicQuestions() {
      setLoadingQs(true);
      try {
        const generated = await callGemini([
          {
            parts: [{
              text: `Generate exactly 10 NEW and UNIQUE multiple-choice interview questions for "${selectedTech}" at difficulty: "${difficulty.toUpperCase()}".
This is Practice Round #${round}. Ensure these are distinct questions testing practical, deep concepts for Tier-1 Product Companies.
Return pure JSON array matching:
[
  {
    "id": number,
    "q": string,
    "options": [string, string, string, string],
    "correct": number (0 to 3 index),
    "explanation": string,
    "code": string
  }
]`
            }]
          }
        ], "You are a Principal Technical Interviewer. Output only JSON array.", true);

        if (Array.isArray(generated) && generated.length > 0) {
          setQuestions(generated);
        } else {
          setQuestions(generateFallbackQuiz(selectedTech, difficulty, round));
        }
      } catch (err) {
        setQuestions(generateFallbackQuiz(selectedTech, difficulty, round));
      } finally {
        setLoadingQs(false);
      }
    }
    loadDynamicQuestions();
  }, [selectedTech, difficulty, round]);

  const currentQ = questions[currentIdx] || questions[0] || generateFallbackQuiz(selectedTech, difficulty, round)[0];

  const handleSelect = (optionIdx) => {
    if (isSubmitted) return;
    setSelectedAnswers({ ...selectedAnswers, [currentIdx]: optionIdx });
  };

  const handleSubmitQuiz = () => {
    setIsSubmitted(true);
    const scoreVal = questions.reduce((acc, q, idx) => acc + (selectedAnswers[idx] === q.correct ? 1 : 0), 0);
    const bonus = scoreVal >= 8 ? 6 : scoreVal >= 5 ? 4 : 2;
    onCompleteSprint("practice", bonus);
  };

  const handleLoadNextTenQuestions = () => {
    setRound(round + 1);
    setCurrentIdx(0);
    setSelectedAnswers({});
    setIsSubmitted(false);
  };

  const handleAddCustomTech = () => {
    if (newTech.trim() && !techList.includes(newTech.trim())) {
      const updated = [...techList, newTech.trim()];
      setTechList(updated);
      setSelectedTech(newTech.trim());
      setNewTech("");
      setRound(1);
      setCurrentIdx(0);
      setSelectedAnswers({});
      setIsSubmitted(false);
    }
  };

  const score = questions.reduce((acc, q, idx) => acc + (selectedAnswers[idx] === q.correct ? 1 : 0), 0);

  return (
    <div className="p-8 max-w-4xl mx-auto space-y-6 rise">
      <div className="border-b border-slate-800 pb-5 space-y-4">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div className="flex items-center gap-2">
              <CodeIcon className="w-5 h-5 text-cyan-400" />
              <h1 className="text-xl font-bold text-white tracking-tight">Practice Lab: {selectedTech}</h1>
              <span className="text-[10px] px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800 font-mono">
                Round #{round}
              </span>
            </div>
            <p className="text-xs text-slate-400 mt-1">10 Distinct MCQs per batch. Practice again anytime to load 10 brand-new questions.</p>
          </div>

          <div className="flex items-center gap-1.5 p-1 bg-slate-900 border border-slate-800 rounded-xl">

/* ---------- 6. Resume Defender View ---------- */
function Defender({ analysis, onCompleteSprint }) {
  const norm = normalizeAnalysis(analysis);
  const targetBullet = norm.highlightedBullet;
  const [messages, setMessages] = useState([]);
  const [userInput, setUserInput] = useState("");
  const [isAiThinking, setIsAiThinking] = useState(false);

  useEffect(() => {
    async function initInterviewer() {
      setIsAiThinking(true);
      try {
        const question = await callGemini([
          {
            parts: [{
              text: `You are an aggressive Staff Interviewer at a Tier-1 tech company evaluating a candidate for: "${norm.targetRole}".
Their resume bullet: "${targetBullet}".
Ask ONE sharp question challenging their tools, implementation details, or scale.`
            }]
          }
        ]);
        setMessages([{ role: "ai", text: question }]);
      } catch (err) {
        setMessages([{
          role: "ai",
          text: `I see on your resume you claim: "${targetBullet}". What specific profiling or instrumentation tools did you use, and how did you measure trade-offs?`
        }]);
      } finally {
        setIsAiThinking(false);
      }
    }
    initInterviewer();
  }, [targetBullet, norm.targetRole]);

  const sendAnswer = async (answerText) => {
    const textToSend = answerText || userInput;
    if (!textToSend.trim() || isAiThinking) return;

    const newMsgs = [...messages, { role: "user", text: textToSend }];
    setMessages(newMsgs);
    setUserInput("");
    setIsAiThinking(true);

    try {
      const response = await callGemini(
        [{
          parts: [{
            text: `Target Role: "${norm.targetRole}"
Claim: "${targetBullet}"
Interviewer: "${messages[messages.length - 1]?.text}"
Candidate response: "${textToSend}"

Evaluate strictly. If ungrounded or lacking metrics, mark isFluff=true, give score <= 3. Format as JSON:
{
  "critique": string,
  "isFluff": boolean,
  "scoreOutOf10": number,
  "starGuidance": string
}`
          }]
        }],
        "You are a ruthless Staff Interviewer. Output valid JSON only.",
        true
      );

      setMessages([...newMsgs, {
        role: "ai",
        badge: response.isFluff,
        score: response.scoreOutOf10,
        text: response.critique,
        star: response.starGuidance
      }]);
      onCompleteSprint("defender", 3);
    } catch (err) {
      setMessages([...newMsgs, {
        role: "ai",
        badge: true,
        score: 2,
        text: "That doesn't answer the question. You need quantitative trade-off metrics. Re-format your answer using the STAR method."
      }]);
      onCompleteSprint("defender", 2);
    } finally {
      setIsAiThinking(false);
    }
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 h-screen">
      <div className="border-r border-slate-800 p-8 overflow-y-auto bg-[#070a12]">
        <div className="text-xs text-slate-500 mb-4 font-mono">Parsed Experience Record</div>
        <div className="border border-slate-800 rounded-2xl p-6 bg-slate-900/40 space-y-3.5 text-sm leading-relaxed text-slate-400">
          <div className="text-white font-bold text-base">{norm.name}</div>
          <div className="text-xs text-slate-500">Target Track: {norm.targetRole}</div>
          <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200">
            <div className="text-[10px] text-amber-400 uppercase tracking-wider font-bold mb-1">Target Claim Under Cross-Examination:</div>
            • {targetBullet}
          </div>
          <p>The Staff Interviewer will scrutinize every word of this statement for vague terminology and ungrounded achievements.</p>
        </div>
      </div>

      <div className="flex flex-col h-screen bg-[#05070d]">
        <div className="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-sm font-bold text-white">Resume Defender</div>
            <div className="text-xs text-rose-400 font-medium">Hostile Interviewer Mode (+3 Readiness per defense)</div>
          </div>
          <div className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"/>
        </div>

        <div className="flex-1 overflow-y-auto px-6 py-5 space-y-4">
          {messages.map((m, i) => (
            <div key={i} className={`rise flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
              <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                m.role === "user" ? "bg-slate-800 text-white" : "bg-slate-900 border border-slate-800 text-slate-300"
              }`}>
                {m.badge && (
                  <div className="flex items-center gap-1.5 text-rose-400 text-xs font-bold mb-2">
                    <BadgeXIcon className="w-3.5 h-3.5"/>Fluff Detected (Score: {m.score}/10)
                  </div>
                )}
                {m.text}
                {m.star && (
                  <div className="mt-2.5 pt-2 border-t border-slate-800 text-xs text-cyan-300">
                    <strong>STAR Direction:</strong> {m.star}
                  </div>
                )}
              </div>
            </div>
          ))}
          {isAiThinking && (
            <div className="flex justify-start">
              <div className="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 flex gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-slate-500 dot1"/>
                <span className="w-1.5 h-1.5 rounded-full bg-slate-500 dot2"/>
                <span className="w-1.5 h-1.5 rounded-full bg-slate-500 dot3"/>
              </div>
            </div>
          )}
        </div>

        <div className="border-t border-slate-800 p-4 space-y-2">
          <button
            onClick={() => sendAnswer("I used standard practices and expanded our cluster allocation.")}
            className="w-full text-left text-xs border border-slate-800 hover:border-cyan-500/40 rounded-xl px-3.5 py-2.5 text-slate-400 hover:text-slate-200 transition-colors flex items-center justify-between"
          >
            <span>[Test Fluffy Answer]: "I used standard practices and expanded our cluster allocation."</span>
            <ArrowIcon className="w-3.5 h-3.5"/>
          </button>
          <div className="flex gap-2">
            <input
              type="text"
              value={userInput}
              onChange={e => setUserInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && sendAnswer()}
              placeholder="Defend your decisions with metrics and tooling..."

            />
            <button onClick={() => sendAnswer()} className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition-colors">
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>
  );

/* ---------- 7. Commute Mode View ---------- */
function CommuteMode({ analysis, onCompleteSprint }) {
  const norm = normalizeAnalysis(analysis);
  const [sessionState, setSessionState] = useState('prompt');
  const [transcript, setTranscript] = useState("");
  const [critiqueData, setCritiqueData] = useState(null);
  const [isProcessing, setIsProcessing] = useState(false);
  const recognitionRef = useRef(null);

  const scenarioPrompt = norm.track === "non-tech"
    ? "Explain how you handle a 12% drop in core checkout conversion after a major UI redesign."
    : `Explain how you architect high-availability and zero-downtime rollouts in ${norm.primaryTech}.`;

  useEffect(() => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      rec.onresult = (e) => {
        let current = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          current += e.results[i][0].transcript;
        }
        setTranscript(current);
      };
      recognitionRef.current = rec;
    }
  }, []);

  const startListening = () => {
    setSessionState('recording');
    setTranscript("");
    try { recognitionRef.current?.start(); } catch (e) {}
  };

  const stopListening = async () => {
    try { recognitionRef.current?.stop(); } catch (e) {}
    setSessionState('feedback');
    setIsProcessing(true);

    const spokenText = transcript.trim() || "Basically, um, we use canary deployments, like, with ingress traffic routing so, uh, if an issue happens we roll back, you know.";
    setTranscript(spokenText);

    try {
      const evaluation = await callGemini(
        [{
          parts: [{
            text: `Candidate answered: '${scenarioPrompt}'.
Candidate spoken response: "${spokenText}".
Analyze verbal delivery and technical content. Count verbal filler words (um, uh, like, you know). Score delivery out of 10.
Return JSON:
{
  "fillerCount": number,
  "speechHygieneCritique": string,
  "technicalCritique": string,
  "deliveryScore": number
}`
          }]
        }],
        "You are an executive speaking coach. Output JSON only.",
        true
      );
      setCritiqueData(evaluation);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(evaluation.speechHygieneCritique));
      }
      onCompleteSprint("commute", 3);
    } catch (err) {
      setCritiqueData({
        fillerCount: 4,
        speechHygieneCritique: "High filler frequency detected ('um', 'like', 'uh', 'you know'). Replace hesitations with a 1-second silent pause.",
        technicalCritique: `Good high-level mention of canary patterns in ${norm.primaryTech}. Dive deeper into metrics-based automated rollbacks.`,
        deliveryScore: 7.2
      });
      onCompleteSprint("commute", 3);
    } finally {
      setIsProcessing(false);
    }
  };

  return (
    <div className="min-h-screen flex flex-col justify-between p-8 max-w-4xl mx-auto rise">
      <div className="flex items-center justify-between border-b border-slate-800 pb-4">
        <div className="flex items-center gap-2">
          <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
          <span className="text-xs font-bold uppercase tracking-wider text-emerald-400">
            Commute Mode · Live Voice Lab (+3 Readiness)
          </span>
        </div>
        <span className="text-xs text-slate-500 font-mono">Web Speech API</span>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center my-8 text-center max-w-2xl mx-auto w-full">
        <div className="mb-10 w-full">
          <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-semibold mb-4">
            <Volume2Icon className="w-3.5 h-3.5" /> Scenario Drill: {norm.targetRole}
          </div>
          <h2 className="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-snug">
            "{scenarioPrompt}"
          </h2>
          <p className="text-xs text-slate-400 mt-2">
            Speak into your microphone. Gemini evaluates filler words and architectural correctness.
          </p>
        </div>

        {sessionState === 'recording' && (
          <div className="mb-8 flex items-center justify-center gap-1.5 h-16">
            {[0.4, 0.7, 0.2, 0.9, 0.5, 0.8, 0.3, 0.95, 0.6, 0.4, 0.85, 0.5, 0.3].map((delay, idx) => (
              <div key={idx} className="audio-bar w-1.5 bg-gradient-to-t from-cyan-500 to-emerald-400 rounded-full"
                   style={{ animationDelay: `${delay}s`, height: `${Math.max(10, delay * 44)}px` }} />
            ))}
          </div>
        )}

        {sessionState !== 'feedback' && (
          <div className="flex flex-col items-center gap-3">
            <button
              onMouseDown={startListening}
              onMouseUp={stopListening}
              onTouchStart={startListening}
              onTouchEnd={stopListening}
              className={`w-28 h-28 rounded-full flex flex-col items-center justify-center transition-all duration-200 select-none shadow-2xl ${
                sessionState === 'recording'
                  ? 'bg-rose-500 scale-105 ring-8 ring-rose-500/20'
                  : 'bg-emerald-500 hover:bg-emerald-400 hover:scale-105 ring-8 ring-emerald-500/10'
              }`}
            >
              <MicIcon className={`w-8 h-8 ${sessionState === 'recording' ? 'text-white animate-pulse' : 'text-slate-950 font-bold'}`} />
              <span className={`text-[10px] font-bold mt-1 tracking-tight ${sessionState === 'recording' ? 'text-white' : 'text-slate-950'}`}>
                {sessionState === 'recording' ? 'Release to Send' : 'Hold to Speak'}
              </span>
            </button>
            <div className="text-xs text-slate-400">
              {sessionState === 'recording' ? (transcript || 'Listening…') : 'Press & hold to speak your answer'}
            </div>
          </div>
        )}

        {sessionState === 'feedback' && (
          <div className="w-full space-y-4 text-left rise">
            <div className="bg-[#090d18] border border-slate-800 rounded-2xl p-5">
              <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>Recognized Speech Transcript</span>
                {critiqueData && (
                  <span className="text-[10px] text-amber-400 font-mono font-bold">
                    {critiqueData.fillerCount || 0} Filler Words Detected
                  </span>
                )}
              </div>
              <p className="text-sm text-slate-200 leading-relaxed">"{transcript}"</p>
            </div>

            {isProcessing ? (
              <div className="p-6 bg-[#090d18] border border-slate-800 rounded-2xl flex items-center justify-center gap-2 text-xs text-cyan-300">
                <span className="w-2 h-2 rounded-full bg-cyan-400 dot1"/>
                <span className="w-2 h-2 rounded-full bg-cyan-400 dot2"/>
                Gemini analyzing speech hygiene and domain depth...
              </div>
            ) : critiqueData && (
              <div className="bg-[#090d18] border border-emerald-500/30 rounded-2xl p-5 shadow-xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <SparklesIcon className="w-4 h-4 text-emerald-400" />
                    <span className="text-xs font-bold text-white uppercase tracking-wider">Gemini Audio Critique</span>
                  </div>
                  <div className="px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold font-mono">
                    Delivery Score: {critiqueData.deliveryScore || 7.2}/10
                  </div>
                </div>

                <div className="space-y-2 text-xs text-slate-300">
                  <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800 text-[11px]">
                    <strong className="text-rose-400">Speech Hygiene: </strong>
                    {critiqueData.speechHygieneCritique}
                  </div>
                  <div>
                    <strong className="text-cyan-300">Domain Depth: </strong>
                    {critiqueData.technicalCritique}
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800 flex justify-end">
                  <button onClick={() => setSessionState('prompt')} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-xl transition-colors flex items-center gap-1.5">
                    Next Scenario <ArrowIcon className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="border-t border-slate-800/80 pt-4 flex items-center justify-between text-xs text-slate-500">
        <span>Runs locally on Web Speech API</span>
        <span>SpeechSynthesis audio feedback enabled</span>
      </div>
    </div>
  );
}

/* ---------- 8. Auth Modal Component ---------- */
function AuthModal({ isOpen, onClose, onGoogleSignIn, onGuestSignIn }) {
  if (!isOpen) return null;
  return (
    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="max-w-sm w-full bg-[#090d18] border border-slate-800 rounded-2xl p-6 space-y-4 rise shadow-2xl">
        <div className="text-center">
          <div className="w-10 h-10 rounded-xl bg-cyan-950 border border-cyan-800 flex items-center justify-center mx-auto text-cyan-400 mb-2">
            <UserIcon className="w-5 h-5"/>
          </div>
          <h3 className="text-base font-bold text-white">Sign In to PrepStack</h3>
          <p className="text-xs text-slate-400 mt-1">Sync your daily streak and readiness score across devices.</p>
        </div>

        <div className="space-y-2 pt-2">
          <button
            onClick={onGoogleSignIn}
            className="w-full py-2.5 px-4 bg-white hover:bg-slate-100 text-slate-950 font-bold text-xs rounded-xl flex items-center justify-center gap-2 transition-colors shadow-md"
          >
            <svg className="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
          </button>

          <button
            onClick={onGuestSignIn}
            className="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs rounded-xl border border-slate-700 transition-colors"
          >
            Instant Developer / Guest Sign-In
          </button>
        </div>

        <button onClick={onClose} className="w-full text-center text-xs text-slate-500 hover:text-slate-400 pt-2 block">
          Cancel
        </button>
      </div>
    </div>
  );
}

/* ---------- Master App Controller (State & Persistence Engine) ---------- */
function App() {
  const [view, setView] = useState("onboarding");
  const [analysis, setAnalysis] = useState(DEFAULT_PERSONAS[0]);
  const [user, setUser] = useState(null);
  const [isAuthOpen, setIsAuthOpen] = useState(false);

  // Live Functional Metrics
  const [readinessScore, setReadinessScore] = useState(64);
  const [activityLog, setActivityLog] = useState({});
  const [currentStreak, setCurrentStreak] = useState(1);

  // Load local or Firebase session on mount
  useEffect(() => {
    const savedLog = localStorage.getItem("prepstack_activity_log");
    const savedScore = localStorage.getItem("prepstack_readiness_score");
    if (savedLog) {
      try { setActivityLog(JSON.parse(savedLog)); } catch (e) {}
    }
    if (savedScore) {
      setReadinessScore(Number(savedScore));
    }

    // Firebase Auth Listener
    const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
      setUser(currentUser);
      if (currentUser) {
        try {
          const docRef = db.collection("users").doc(currentUser.uid);
          const doc = await docRef.get();
          if (doc.exists) {
            const data = doc.data();
            if (data.readinessScore) setReadinessScore(data.readinessScore);
            if (data.activityLog) setActivityLog(data.activityLog);
            if (data.analysis) setAnalysis(normalizeAnalysis(data.analysis));
          }
        } catch (e) {
          console.warn("Firestore sync notice:", e);
        }
      }
    });

    return () => unsubscribe();
  }, []);

  // Calculate Streak whenever activityLog changes
  useEffect(() => {
    let streak = 0;
    const today = new Date();
    const todayStr = getTodayString();
    
    // Check if today was done
    let d = new Date();
    if (!activityLog[todayStr]) {
      // Check if yesterday was done
      d.setDate(d.getDate() - 1);
    }

    while (true) {
      const checkStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
      if (activityLog[checkStr] && activityLog[checkStr] > 0) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    setCurrentStreak(Math.max(1, streak));
  }, [activityLog]);

  // Unified Functional Activity Recorder
  const handleCompleteSprint = (sprintType, pointsEarned = 3) => {
    const todayStr = getTodayString();
    const updatedCount = (activityLog[todayStr] || 0) + 1;
    const updatedLog = { ...activityLog, [todayStr]: updatedCount };
    const newScore = Math.min(100, readinessScore + pointsEarned);

    setActivityLog(updatedLog);
    setReadinessScore(newScore);

    localStorage.setItem("prepstack_activity_log", JSON.stringify(updatedLog));
    localStorage.setItem("prepstack_readiness_score", String(newScore));

    // Persist to Cloud Firestore if logged in
    if (user) {
      try {
        db.collection("users").doc(user.uid).set({
          readinessScore: newScore,
          activityLog: updatedLog,
          lastActivity: todayStr,
          analysis: analysis
        }, { merge: true });
      } catch (e) {}
    }
  };

  const handleOnboardingComplete = (data) => {
    const norm = normalizeAnalysis(data);
    setAnalysis(norm);
    setReadinessScore(norm.readinessScore);
    setView("dashboard");
    handleCompleteSprint("onboarding", 2);
  };

  const handleGoogleSignIn = async () => {
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
      setIsAuthOpen(false);
    } catch (e) {
      handleGuestSignIn();
    }
  };

  const handleGuestSignIn = () => {
    const mockUser = {
      uid: "guest_" + Date.now(),
      displayName: analysis.name || "Software Specialist",
      email: "engineer@prepstack.dev"
    };
    setUser(mockUser);
    setIsAuthOpen(false);
  };

  const handleSignOut = async () => {
    try { await auth.signOut(); } catch (e) {}
    setUser(null);
  };

  return (
    <ErrorBoundary>
      <AuthModal
        isOpen={isAuthOpen}
        onClose={() => setIsAuthOpen(false)}
        onGoogleSignIn={handleGoogleSignIn}
        onGuestSignIn={handleGuestSignIn}
      />

      {view === "onboarding" ? (
        <Onboarding onComplete={handleOnboardingComplete} />
      ) : (
        <Shell
          active={view}
          setView={setView}
          onReplay={() => setView("onboarding")}
          analysis={analysis}
          user={user}
          onSignIn={() => setIsAuthOpen(true)}
          onSignOut={handleSignOut}
        >
          {view === "dashboard" && (
            <Dashboard
              analysis={analysis}
              readinessScore={readinessScore}
              activityLog={activityLog}
              currentStreak={currentStreak}
              setView={setView}
            />
          )}
          {view === "practice" && <PracticeMode analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
          {view === "star" && <StarStudio analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
          {view === "defender" && <Defender analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
          {view === "commute" && <CommuteMode analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
        </Shell>
      )}
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
