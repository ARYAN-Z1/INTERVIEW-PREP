/* ---------- Resilient Parser & Type Normalizers ---------- */
function safeArray(val, fallback = []) {
  if (Array.isArray(val)) return val.filter(Boolean);
  if (typeof val === 'string' && val.trim().length > 0) {
    return val.split(',').map(s => s.trim().replace(/^[-•*\d.]+\s*/, '')).filter(Boolean);
  }
  return fallback;
}

function cleanJsonParse(text) {
  if (!text) return null;
  let str = String(text).trim();

  // Strip markdown code fences if present
  const fenceMatch = str.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if (fenceMatch && fenceMatch) {
    str = fenceMatch.trim();
  } else {
    const firstSquare = str.indexOf('[');
    const firstCurly = str.indexOf('{');
    let startIdx = -1;
    if (firstSquare !== -1 && firstCurly !== -1) startIdx = Math.min(firstSquare, firstCurly);
    else if (firstSquare !== -1) startIdx = firstSquare;
    else if (firstCurly !== -1) startIdx = firstCurly;

    const lastSquare = str.lastIndexOf(']');
    const lastCurly = str.lastIndexOf('}');
    const endIdx = Math.max(lastSquare, lastCurly);

    if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
      str = str.substring(startIdx, endIdx + 1);
    }
  }

  // Remove trailing commas before closing braces/brackets
  str = str.replace(/,\s*([\]}])/g, '$1');

  try {
    return JSON.parse(str);
  } catch (err) {
    const sanitized = str.replace(/[\x00-\x1F\x7F-\x9F]/g, "");
    return JSON.parse(sanitized);
  }
}

/* ---------- Resilient Gemini AI Caller ---------- */
async function callGemini(contents, systemInstruction = "", expectJson = false) {
  const apiKey = getActiveGeminiKey();
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
  
  const body = {
    contents: contents,
    generationConfig: {
      temperature: 0.2,
      responseMimeType: expectJson ? "application/json" : "text/plain"
    }
  };
  if (systemInstruction) {
    body.systemInstruction = { parts: [{ text: systemInstruction }] };
  }

  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`Gemini API HTTP ${response.status}: ${errText}`);
  }
  const data = await response.json();
  const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
  return expectJson ? cleanJsonParse(rawText) : rawText;
}

/* ---------- 1. Error Boundary ---------- */
class ErrorBoundary extends Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.warn("PrepStack caught UI error:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-[#05070d] flex items-center justify-center p-6 text-center">
          <div className="max-w-md bg-[#090d18] border border-slate-800 rounded-2xl p-8 space-y-4">
            <div className="w-12 h-12 rounded-full bg-cyan-950 border border-cyan-800 flex items-center justify-center mx-auto text-cyan-400">
              <SparklesIcon className="w-6 h-6"/>
            </div>
            <h2 className="text-lg font-bold text-white">Workspace Ready</h2>
            <p className="text-xs text-slate-400">Click below to return to your personalized dashboard.</p>
            <button
              onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
              className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold rounded-xl"
            >
              Reload Dashboard
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

  const [resumeText, setResumeText] = useState("");
  const fileInputRef = useRef(null);

  const [candidateProfile, setCandidateProfile] = useState({
    name: "Aryan Mani",
    track: "tech",
    currentRole: "Software Engineer (TCS BaNCS)",
    primarySkill: "Java",
    detectedTechs: ["Java", "Docker", "Python", "Kubernetes", "PostgreSQL", "React.js"],
    highlightedBullet: "Engineered scalable Java microservices and ISO 20022 pipelines for Tier-1 banks.",
    rawSummary: ""
  });

  const [targetRole, setTargetRole] = useState("Staff Software Engineer (Tier-1 Product)");
  const [techList, setTechList] = useState(["Java", "Docker", "Python", "Kubernetes", "PostgreSQL"]);
  const [newTechInput, setNewTechInput] = useState("");
  const [timeline, setTimeline] = useState("60 Days Standard");

  const parseResumeFileOrText = async (fileOrText, isFile = false) => {
    setLoading(true);
    setStatusMsg("Deep scanning resume: extracting all technologies, frameworks, and roles...");

    try {
      let parts = [];
      if (isFile) {
        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const res = reader.result;
            const idx = res.indexOf(',');
            resolve(idx !== -1 ? res.slice(idx + 1) : res);
          };
          reader.onerror = reject;
          reader.readAsDataURL(fileOrText);
        });
        parts.push({ inlineData: { mimeType: fileOrText.type || "application/pdf", data: base64Data } });
      } else {
        parts.push({ text: fileOrText });
      }

      parts.push({
        text: `Analyze this resume (Tech or Non-Tech).
CRITICAL: Extract ALL detected technologies, programming languages, cloud tools, or methodologies mentioned anywhere in the resume into "detectedTechs".
Return pure JSON with:
{
  "name": string,
  "track": "tech" or "non-tech",
  "currentRole": string,
  "primarySkillOrDomain": string,
  "detectedTechs": [string],
  "highlightedBullet": string
}`
      });

      const parsed = await callGemini([{ parts }], "You are an expert career intelligence engine. Output valid JSON only.", true);
      const extractedTechs = safeArray(parsed?.detectedTechs, ["Java", "Docker", "Python", "Kubernetes", "PostgreSQL"]);

      setCandidateProfile({
        name: parsed?.name || "Aryan Mani",
        track: parsed?.track || "tech",
        currentRole: parsed?.currentRole || "Senior Systems Engineer",
        primarySkill: parsed?.primarySkillOrDomain || extractedTechs[0] || "Java",
        detectedTechs: extractedTechs,
        highlightedBullet: parsed?.highlightedBullet || "Optimized infrastructure and distributed workflow pipelines.",
        rawSummary: extractedTechs.join(", ")
      });

      setTechList(extractedTechs);
      setTargetRole(parsed?.track === "non-tech" ? "Senior Product Manager (Tier-1)" : "Staff Software Engineer (Tier-1)");
      setStep("questionnaire");
    } catch (err) {
      console.warn("Resume parsing fallback activated:", err);
      loadPreset(DEFAULT_PERSONAS[0]);
    } finally {
      setLoading(false);
    }
  };

  const loadPreset = (preset) => {
    setCandidateProfile({
      name: "Aryan Mani",
      track: preset.track,
      currentRole: preset.current,
      primarySkill: preset.primary,
      detectedTechs: preset.detectedTechs,
      highlightedBullet: preset.bullet,
      missingSkills: preset.missing,
      fluffToRemove: preset.fluff
    });
    setTechList(preset.detectedTechs);
    setTargetRole(preset.target);
    setStep("questionnaire");
  };

  const addTechTag = () => {
    if (newTechInput.trim() && !techList.includes(newTechInput.trim())) {
      setTechList([...techList, newTechInput.trim()]);
      setNewTechInput("");
    }
  };

  const removeTechTag = (t) => {
    setTechList(techList.filter(item => item !== t));
  };

  const handleGenerateFinalWorkspace = async () => {
    setStep("generating");
    setStatusMsg("Building individualized 10-question quiz tracks for " + techList.join(", ") + "...");

    try {
      const workspacePayload = await callGemini([
        {
          parts: [{
            text: `Construct an As-Is vs To-Be Gap Analysis for a candidate targeting: "${targetRole}" with core technology matrix: "${techList.join(', ')}".
Return pure JSON matching:
{
  "readinessScore": number,
  "primaryTech": "${techList[0] || 'Java'}",
  "detectedTechs": ${JSON.stringify(techList)},
  "targetRole": "${targetRole}",
  "missingSkills": [string, string, string],
  "fluffToRemove": [string, string, string],
  "highlightedBullet": "${candidateProfile.highlightedBullet || 'Engineered scalable system operations.'}"
}`
          }]
        }
      ], "You are a Principal Technical Interview Director. Output JSON only.", true);

      onComplete(normalizeAnalysis({
        ...workspacePayload,
        name: candidateProfile.name,
        track: candidateProfile.track,
        detectedTechs: techList,
        timeline: timeline
      }));
    } catch (e) {
      onComplete(normalizeAnalysis({
        readinessScore: 68,
        primaryTech: techList[0] || "Java",
        detectedTechs: techList,
        targetRole: targetRole,
        missingSkills: ["Distributed Consensus", "High-Throughput Partitioning", "Observability (OpenTelemetry)"],
        fluffToRemove: ["Manual operations", "Generic ticketing reports", "Waterfall handoffs"],
        highlightedBullet: candidateProfile.highlightedBullet || "Optimized core systems by 35% across legacy architecture.",
        name: candidateProfile.name,
        track: candidateProfile.track,
        timeline: timeline
      }));
    }
  };

  return (
    <div className="min-h-screen grid-bg flex items-center justify-center p-6">
      {step === "upload" && (
        <div className="w-full max-w-xl rise space-y-6">
          <div className="text-center">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-semibold mb-3">
              <SparklesIcon className="w-3.5 h-3.5"/> Universal Resume Intelligence
            </div>
            <h1 className="text-3xl font-extrabold text-white tracking-tight">Upload Resume & Extract All Tech</h1>
            <p className="text-slate-400 text-xs md:text-sm mt-1">
              Gemini scans your profile and automatically creates dedicated <strong>10-Question Quiz Tracks</strong> for each technology.
            </p>
          </div>

          <div className="flex border border-slate-800 rounded-xl p-1 bg-slate-900/60 max-w-xs mx-auto">
            <button
              onClick={() => setInputTab("file")}
              className={`flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${inputTab === "file" ? "bg-cyan-500/20 text-cyan-300 border border-cyan-500/40" : "text-slate-400 hover:text-white"}`}
            >
              Upload PDF / DOCX
            </button>
            <button
              onClick={() => setInputTab("text")}
              className={`flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all ${inputTab === "text" ? "bg-cyan-500/20 text-cyan-300 border border-cyan-500/40" : "text-slate-400 hover:text-white"}`}
            >
              Paste Text
            </button>
          </div>

          {inputTab === "file" ? (
            <>
              <input type="file" ref={fileInputRef} onChange={(e) => e.target.files?.[0] && parseResumeFileOrText(e.target.files[0], true)} accept=".pdf,.doc,.docx,.txt" className="hidden" />

              <button
                onClick={() => fileInputRef.current?.click()}
                disabled={loading}
                className="w-full border-2 border-dashed border-slate-700/80 hover:border-cyan-500/60 bg-[#090d18] hover:bg-slate-900/80 rounded-2xl p-8 flex flex-col items-center gap-3 transition-all cursor-pointer shadow-xl"
              >
                {!loading ? (
                  <>
                    <div className="w-14 h-14 rounded-2xl bg-slate-800 flex items-center justify-center text-cyan-400 shadow-md">
                      <UploadIcon className="w-6 h-6"/>
                    </div>
                    <div className="text-sm font-bold text-white">Upload Your Actual Resume (PDF or DOCX)</div>
                    <span className="text-xs text-slate-500">Auto-detects languages, frameworks, cloud tools & domain</span>
                  </>
                ) : (
                  <div className="py-4 flex flex-col items-center gap-2">
                    <div className="flex gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot1"/>
                      <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot2"/>
                      <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot3"/>
                    </div>
                    <span className="text-xs text-cyan-300 font-mono mt-1 text-center">{statusMsg}</span>
                  </div>
                )}
              </button>
            </>
          ) : (
            <div className="border border-slate-800 bg-[#090d18] rounded-2xl p-6 space-y-4">
              <label className="text-xs font-bold text-slate-300 block">Paste Resume Content or Profile Bio:</label>
              <textarea
                value={resumeText}
                onChange={e => setResumeText(e.target.value)}
                placeholder="Paste work experience, skills (e.g. Java, Docker, Python, Spring Boot), and key projects..."
                rows="6"
                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
              />
              <button
                onClick={() => parseResumeFileOrText(resumeText, false)}
                disabled={loading || !resumeText.trim()}
                className="w-full py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition-all disabled:opacity-50"
              >
                {loading ? "Parsing Resume..." : "Extract Profile & Setup Quiz Tracks"}
              </button>
            </div>
          )}

          <div className="space-y-2 pt-2">
            <div className="text-[11px] font-bold uppercase tracking-wider text-slate-500 text-center font-mono">
              Or Try Pre-Loaded Resume Archetypes:
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
              {DEFAULT_PERSONAS.map((p, idx) => (
                <button
                  key={idx}
                  onClick={() => loadPreset(p)}
                  className="p-3 rounded-xl bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800 hover:border-slate-700 text-left transition-all group"
                >
                  <div className="text-xs font-bold text-white group-hover:text-cyan-300">{p.name}</div>
                  <div className="text-[10px] text-slate-500 mt-0.5">{p.detectedTechs?.slice(0, 3).join(", ")}</div>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {step === "questionnaire" && (
        <div className="w-full max-w-lg rise border border-slate-800 bg-[#090d18] rounded-2xl p-7 space-y-6 shadow-2xl">
          <div className="border-b border-slate-800 pb-4">
            <div className="flex items-center gap-2 text-cyan-400 text-xs font-bold font-mono uppercase tracking-wider mb-1">
              <SlidersIcon className="w-4 h-4"/> Step 2: Auto-Extracted Technologies
            </div>
            <h2 className="text-xl font-bold text-white">Parsed Profile: {candidateProfile.currentRole}</h2>
            <p className="text-xs text-slate-400 mt-1">We parsed these technologies. Each will receive its own full 10-Question Practice Lab.</p>
          </div>

          <div className="space-y-4 text-xs">
            <div>
              <label className="font-bold text-slate-300 block mb-1.5">1. Target Dream Role & Tier</label>
              <input
                type="text"
                value={targetRole}
                onChange={e => setTargetRole(e.target.value)}
                placeholder="e.g. Staff Software Engineer (Tier-1 Product)"
                className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
              />
            </div>

            <div>
              <label className="font-bold text-slate-300 block mb-1.5">2. Technologies Extracted from Resume (Independent 10-Q Tracks)</label>
              <div className="flex flex-wrap gap-1.5 mb-2">
                {techList.map((t) => (
                  <span key={t} className="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-cyan-950 text-cyan-200 border border-cyan-800 font-mono text-xs">
                    {t}
                    <button onClick={() => removeTechTag(t)} className="text-slate-400 hover:text-rose-400 font-bold ml-1">×</button>
                  </span>
                ))}
              </div>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={newTechInput}
                  onChange={e => setNewTechInput(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && addTechTag()}
                  placeholder="Add another technology (e.g. Kafka, Redis, AWS)..."
                  className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500"
                />
                <button onClick={addTechTag} className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 text-slate-200">
                  + Add
                </button>
              </div>
            </div>

            <div>
              <label className="font-bold text-slate-300 block mb-1.5">3. Target Timeline</label>
              <div className="grid grid-cols-3 gap-2">
                {["30 Days Sprint", "60 Days Standard", "90 Days Comprehensive"].map(t => (
                  <button
                    key={t}
                    onClick={() => setTimeline(t)}
                    className={`py-2 px-2.5 rounded-xl border text-center transition-all ${
                      timeline === t
                        ? "bg-cyan-500/10 border-cyan-500/60 text-cyan-300 font-bold"
                        : "bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200"
                    }`}
                  >
                    {t}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <button
            onClick={handleGenerateFinalWorkspace}
            className="w-full py-3 bg-gradient-to-r from-cyan-500 to-emerald-400 hover:opacity-95 text-slate-950 font-extrabold text-xs rounded-xl transition-all shadow-lg shadow-cyan-950/40 flex items-center justify-center gap-2"
          >
            Construct My Custom Workspace <ArrowIcon className="w-4 h-4"/>
          </button>
        </div>
      )}

      {step === "generating" && (
        <div className="w-full max-w-md rise text-center py-12 space-y-4">
          <div className="flex justify-center gap-2">
            <span className="w-3 h-3 rounded-full bg-cyan-400 dot1"/>
            <span className="w-3 h-3 rounded-full bg-cyan-400 dot2"/>
            <span className="w-3 h-3 rounded-full bg-cyan-400 dot3"/>
          </div>
          <h3 className="text-lg font-bold text-white">Synthesizing Tailored Experience</h3>
          <p className="text-xs text-slate-400 px-4">{statusMsg}</p>
        </div>
      )}
    </div>
  );
}

/* ---------- 3. Command Center View ---------- */
function Dashboard({ analysis, readinessScore, activityLog, currentStreak, setView }) {
  const norm = normalizeAnalysis(analysis);
  const pct = readinessScore;
  const radius = 28;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference * (1 - pct / 100);

  const todayStr = getTodayString();
  const calendarDays = [];
  for (let i = 125; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
    const count = activityLog[dateStr] || 0;
    calendarDays.push({
      dateStr,
      count,
      level: count >= 3 ? 4 : count === 2 ? 3 : count === 1 ? 2 : 0
    });
  }

  const calendarWeeks = [];
  for (let w = 0; w < 18; w++) {
    calendarWeeks.push(calendarDays.slice(w * 7, (w + 1) * 7));
  }

  const todayCount = activityLog[todayStr] || 0;

  return (
    <div className="p-6 max-w-5xl mx-auto space-y-4 rise">
      <div>
        <div className="flex items-center gap-2">
          <h1 className="text-2xl font-bold tracking-tight text-white">Command Center</h1>
          <span className="text-xs px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800 font-mono">
            {norm.targetRole}
          </span>
        </div>
        <p className="text-slate-400 text-xs mt-0.5">Live interview readiness metrics calculated across deliberate practice sessions.</p>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div className="md:col-span-5 border border-slate-800 bg-[#090d18] rounded-2xl p-5 flex items-center gap-4">
          <div className="relative flex items-center justify-center shrink-0">
            <svg width="74" height="74" className="-rotate-90">
              <circle cx="37" cy="37" r={radius} stroke="#1e293b" strokeWidth="6" fill="none"/>
              <circle
                cx="37" cy="37" r={radius}
                stroke="url(#accentGrad)" strokeWidth="6" fill="none"
                strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round"
              />
              <defs>
                <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stopColor="#22d3ee"/>
                  <stop offset="100%" stopColor="#34d399"/>
                </linearGradient>
              </defs>
            </svg>
            <div className="absolute text-xl font-bold text-white tracking-tight">{pct}</div>
          </div>

          <div className="min-w-0 space-y-1">
            <div className="flex items-center gap-1.5">
              <span className="text-xs font-bold text-white">Live Readiness Score</span>
              <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">Reactive</span>
            </div>
            <div className="text-[11px] text-slate-400">Target benchmark: <strong className="text-slate-200">85+ Benchmark</strong></div>
            <div className="text-[10px] text-cyan-400 font-medium">Increases as you finish 10-Q MCQs & Defense drills</div>
          </div>
        </div>

        <div className="md:col-span-7 border border-slate-800 bg-[#090d18] rounded-2xl p-5 flex flex-col justify-between">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <FlameIcon className="w-4 h-4 text-emerald-400"/>
              <span className="text-xs font-bold text-white">Daily Deliberate Practice Streak</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-2 py-0.5 rounded font-semibold">
                {currentStreak} Day{currentStreak === 1 ? '' : 's'} Active
              </span>
              <span className={`text-[10px] font-mono px-2 py-0.5 rounded ${todayCount > 0 ? 'bg-cyan-950 text-cyan-300 border border-cyan-800' : 'bg-slate-900 text-slate-400'}`}>
                {todayCount > 0 ? `Today: ${todayCount} Done` : 'Today: Incomplete'}
              </span>
            </div>
          </div>

          <div className="flex gap-1.5 items-center overflow-x-auto py-1">
            {calendarWeeks.map((week, wIdx) => (
              <div key={wIdx} className="flex flex-col gap-1.5 shrink-0">
                {week.map((day, dIdx) => (
                  <div
                    key={dIdx}
                    title={`${day.dateStr}: ${day.count} sprint(s)`}
                    className={`w-3 h-3 rounded-[3px] ${HEAT_COLORS[day.level]} hover:ring-1 hover:ring-white transition-all cursor-pointer`}
                  />
                ))}
              </div>
            ))}
          </div>

          <div className="flex items-center justify-between text-[10px] text-slate-500 pt-2 border-t border-slate-800/80">
            <span>Last 18 weeks (Today on bottom right)</span>
            <div className="flex items-center gap-1.5">
              <span>Less</span>
              <span className="w-2.5 h-2.5 rounded-[2px] bg-slate-800/40" />

/* ---------- 4. Multi-Tech Practice Lab (10-Question Guarantee) ---------- */
function PracticeMode({ analysis, onCompleteSprint }) {
  const norm = normalizeAnalysis(analysis);
  const [techList, setTechList] = useState(norm.detectedTechs);
  const [selectedTech, setSelectedTech] = useState(norm.detectedTechs[0] || "Java");
  const [difficulty, setDifficulty] = useState("medium");
  const [round, setRound] = useState(1);
  const [newTech, setNewTech] = useState("");

  const [currentIdx, setCurrentIdx] = useState(0);
  const [selectedAnswers, setSelectedAnswers] = useState({});
  const [flaggedQuestions, setFlaggedQuestions] = useState({});
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [questions, setQuestions] = useState([]);
  const [loadingQs, setLoadingQs] = useState(false);
  const [secondsRemaining, setSecondsRemaining] = useState(900); // 15 mins
  const [copiedSummary, setCopiedSummary] = useState(false);

  useEffect(() => {
    if (isSubmitted || loadingQs) return;
    const interval = setInterval(() => {
      setSecondsRemaining(prev => {
        if (prev <= 1) {
          clearInterval(interval);
          handleSubmitQuiz();
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [isSubmitted, loadingQs]);

  useEffect(() => {
    async function loadDynamicQuestions() {
      setLoadingQs(true);
      setSecondsRemaining(900);
      try {
        const generated = await callGemini([
          {
            parts: [{
              text: `Generate exactly 10 NEW and UNIQUE multiple-choice interview questions for "${selectedTech}" at difficulty level: "${difficulty.toUpperCase()}".
This is Practice Round #${round}.
CRITICAL REQUIREMENTS:
1. Provide an array of EXACTLY 10 distinct questions (no fewer, no more).
2. Target Staff/Senior Engineer standards at Tier-1 companies (Google, Uber, Stripe).
3. Return pure JSON array matching:
[
  {
    "id": number (1 to 10),
    "q": string,
    "options": [string, string, string, string],
    "correct": number (0, 1, 2, or 3),
    "explanation": string,
    "code": string
  }
]`
            }]
          }
        ], "You are a Principal Technical Interviewer. Output only JSON array containing exactly 10 questions.", true);

        if (Array.isArray(generated) && generated.length >= 10) {
          setQuestions(generated.slice(0, 10));
        } else if (Array.isArray(generated) && generated.length > 0) {
          const fallbacks = generateFallbackQuiz(selectedTech, difficulty, round);
          const merged = [...generated];
          for (let i = generated.length; i < 10; i++) {
            merged.push(fallbacks[i] || {
              id: i + 1,
              q: `[${difficulty.toUpperCase()} • Q${i+1}] In ${selectedTech}, what is the recommended design strategy for failure isolation?`,
              options: [
                "Implement bulkheads and rate-limiting per client tier",
                "Share single worker pools across all traffic types",
                "Disable timeout metrics",
                "Route all requests through single master node"
              ],
              correct: 0,
              explanation: "Bulkheads isolate resources so failure in one tenant or endpoint does not cascade across the entire cluster.",
              code: `// Bulkhead configuration:\nThreadPoolExecutor pool = new ThreadPoolExecutor(10, 20, ...)`
            });
          }
          setQuestions(merged);
        } else {
          setQuestions(generateFallbackQuiz(selectedTech, difficulty, round));
        }
      } catch (err) {
        console.warn("Dynamic question generation notice, loading 10-Q fallback suite:", err);
        setQuestions(generateFallbackQuiz(selectedTech, difficulty, round));
      } finally {
        setLoadingQs(false);
      }
    }
    loadDynamicQuestions();
  }, [selectedTech, difficulty, round]);

  const currentQ = questions[currentIdx] || questions[0] || generateFallbackQuiz(selectedTech, difficulty, round)[0];

  const handleSelect = (optionIdx) => {
    if (isSubmitted) return;
    setSelectedAnswers({ ...selectedAnswers, [currentIdx]: optionIdx });
  };

  const toggleFlag = (idx) => {
    setFlaggedQuestions({ ...flaggedQuestions, [idx]: !flaggedQuestions[idx] });
  };

  const handleSubmitQuiz = () => {
    setIsSubmitted(true);
    const scoreVal = questions.reduce((acc, q, idx) => acc + (selectedAnswers[idx] === q.correct ? 1 : 0), 0);
    const bonus = scoreVal >= 8 ? 6 : scoreVal >= 5 ? 4 : 2;
    onCompleteSprint("practice", bonus);
  };

  const handleLoadNextTenQuestions = () => {
    setRound(round + 1);
    setCurrentIdx(0);
    setSelectedAnswers({});
    setFlaggedQuestions({});
    setIsSubmitted(false);
  };

  const handleAddCustomTech = () => {
    if (newTech.trim() && !techList.includes(newTech.trim())) {
      const updated = [...techList, newTech.trim()];
      setTechList(updated);
      setSelectedTech(newTech.trim());
      setNewTech("");
      setRound(1);
      setCurrentIdx(0);
      setSelectedAnswers({});
      setFlaggedQuestions({});
      setIsSubmitted(false);
    }
  };

  const copyResults = () => {
    const scoreVal = questions.reduce((acc, q, idx) => acc + (selectedAnswers[idx] === q.correct ? 1 : 0), 0);
    const text = `PrepStack Quiz Results • ${selectedTech} (${difficulty.toUpperCase()})\nScore: ${scoreVal}/10 (${Math.round((scoreVal/10)*100)}%)\nRound #${round} Completed on PrepStack`;
    navigator.clipboard.writeText(text);
    setCopiedSummary(true);
    setTimeout(() => setCopiedSummary(false), 2500);
  };

  const score = questions.reduce((acc, q, idx) => acc + (selectedAnswers[idx] === q.correct ? 1 : 0), 0);
  const minutes = Math.floor(secondsRemaining / 60);
  const seconds = secondsRemaining % 60;

  return (
    <div className="p-8 max-w-4xl mx-auto space-y-6 rise">
      <div className="border-b border-slate-800 pb-5 space-y-4">
        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div className="flex items-center gap-2">
              <CodeIcon className="w-5 h-5 text-cyan-400" />
              <h1 className="text-xl font-bold text-white tracking-tight">Practice Lab: {selectedTech}</h1>
              <span className="text-[10px] px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800 font-mono">
                Round #{round} • 10 Questions
              </span>
            </div>
            <p className="text-xs text-slate-400 mt-1">10 Distinct MCQs per batch. Practice again anytime to load 10 brand-new questions.</p>
          </div>

          <div className="flex items-center gap-3">
            {!isSubmitted && (
              <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 font-mono text-xs text-amber-300">
                <ClockIcon className="w-3.5 h-3.5 text-amber-400" />
                <span>{String(minutes).padStart(2, '0')}:{String(seconds).padStart(2, '0')}</span>
              </div>
            )}
            <div className="flex items-center gap-1.5 p-1 bg-slate-900 border border-slate-800 rounded-xl">
              {[
                { id: "easy", label: "Easy", color: "text-emerald-400" },
                { id: "medium", label: "Medium", color: "text-amber-400" },
                { id: "hard", label: "Hard", color: "text-rose-400" }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setDifficulty(tab.id); setCurrentIdx(0); setSelectedAnswers({}); setFlaggedQuestions({}); setIsSubmitted(false); }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                    difficulty === tab.id
                      ? "bg-slate-800 text-white shadow-sm border border-slate-700/60"
                      : "text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <span className={difficulty === tab.id ? tab.color : ""}>{tab.label}</span>
                </button>
              ))}
            </div>
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-2 pt-2">
          <span className="text-xs text-slate-500 font-mono mr-1">Select Track:</span>
          {techList.map((tech) => (
            <button
              key={tech}
              onClick={() => {
                setSelectedTech(tech);
                setCurrentIdx(0);
                setSelectedAnswers({});
                setFlaggedQuestions({});
                setIsSubmitted(false);
                setRound(1);
              }}
              className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${
                selectedTech === tech
                  ? "bg-cyan-500/10 border-cyan-500/60 text-cyan-300 shadow-sm ring-1 ring-cyan-500/20"
                  : "bg-slate-900/60 border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700"
              }`}
            >
              {tech}
            </button>
          ))}

          <div className="flex items-center gap-1.5 ml-2">
            <input
              type="text"
              value={newTech}
              onChange={e => setNewTech(e.target.value)}
              onKeyDown={e => e.key === "Enter" && handleAddCustomTech()}
              placeholder="+ New tech..."
              className="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-cyan-500 w-28"
            />
            <button onClick={handleAddCustomTech} className="p-1 rounded-lg bg-slate-800 text-slate-300 hover:text-white border border-slate-700">
              <PlusIcon className="w-3.5 h-3.5"/>
            </button>
          </div>
        </div>
      </div>

      {loadingQs ? (
        <div className="py-16 flex flex-col items-center justify-center gap-3">
          <div className="flex gap-1.5">
            <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot1"/>
            <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot2"/>
            <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 dot3"/>
          </div>
          <span className="text-xs text-cyan-300 font-mono">Generating 10 production-ready {difficulty.toUpperCase()} questions for {selectedTech} (Round #{round})...</span>
        </div>
      ) : !isSubmitted ? (
        <div className="space-y-5">
          <div className="flex items-center justify-between gap-2 p-3 bg-slate-900/60 border border-slate-800 rounded-2xl">
            <div className="flex items-center gap-1.5 overflow-x-auto py-1">
              {questions.map((_, qIdx) => {
                const isAnswered = selectedAnswers[qIdx] !== undefined;
                const isCurrent = currentIdx === qIdx;
                const isFlagged = flaggedQuestions[qIdx];
                return (
                  <button
                    key={qIdx}
                    onClick={() => setCurrentIdx(qIdx)}
                    className={`w-8 h-8 rounded-lg text-xs font-mono font-bold transition-all relative ${
                      isCurrent
                        ? "bg-cyan-500 text-slate-950 ring-2 ring-cyan-400/40"
                        : isAnswered
                        ? "bg-emerald-950 text-emerald-300 border border-emerald-800"
                        : "bg-slate-800/80 text-slate-400 hover:bg-slate-700 border border-slate-700/60"
                    }`}
                  >
                    {qIdx + 1}
                    {isFlagged && (
                      <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-amber-400" />
                    )}
                  </button>
                );
              })}
            </div>

            <button
              onClick={() => toggleFlag(currentIdx)}
              title="Flag question for review"
              className={`p-2 rounded-xl border text-xs flex items-center gap-1.5 transition-colors ${
                flaggedQuestions[currentIdx]
                  ? "bg-amber-500/20 text-amber-300 border-amber-500/40"
                  : "bg-slate-900 text-slate-400 border-slate-800 hover:text-white"
              }`}
            >
              <BookmarkIcon className="w-3.5 h-3.5" />
              <span className="hidden md:inline">{flaggedQuestions[currentIdx] ? "Flagged" : "Flag"}</span>
            </button>
          </div>

          <div className="border border-slate-800 bg-[#090d18] rounded-2xl p-6 space-y-5">
            <div className="flex items-center justify-between text-xs text-slate-400">
              <span className="font-mono">Question <strong className="text-white">{currentIdx + 1}</strong> of 10</span>
              <span className="text-[10px] font-mono text-cyan-400 bg-cyan-950/60 border border-cyan-800/60 px-2 py-0.5 rounded uppercase">
                {selectedTech} • {difficulty}
              </span>
            </div>

            <h2 className="text-base font-bold text-white leading-relaxed">{currentIdx + 1}. {currentQ.q}</h2>
            
            {currentQ.code && (
              <div className="p-3.5 bg-[#05070d] rounded-xl border border-slate-800 font-mono text-[11px] text-emerald-300 overflow-x-auto">
                <pre>{currentQ.code}</pre>
              </div>
            )}

            <div className="space-y-2.5">
              {currentQ.options?.map((option, optIdx) => {
                const isSelected = selectedAnswers[currentIdx] === optIdx;
                const letter = ["A", "B", "C", "D"][optIdx];
                return (
                  <button
                    key={optIdx}
                    onClick={() => handleSelect(optIdx)}
                    className={`w-full text-left p-4 rounded-xl border text-xs md:text-sm transition-all flex items-center gap-3 ${
                      isSelected
                        ? "bg-cyan-500/10 border-cyan-500/60 text-cyan-100 ring-1 ring-cyan-500/30"
                        : "bg-slate-900/60 border-slate-800 hover:border-slate-700 text-slate-300 hover:bg-slate-900"
                    }`}
                  >
                    <span className={`w-6 h-6 rounded-lg flex items-center justify-center font-mono font-bold text-xs shrink-0 ${
                      isSelected ? "bg-cyan-500 text-slate-950 font-bold" : "bg-slate-800 text-slate-400"
                    }`}>{letter}</span>
                    <span className="flex-1">{option}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="flex items-center justify-between pt-2">
            <button
              onClick={() => setCurrentIdx(Math.max(0, currentIdx - 1))}
              disabled={currentIdx === 0}
              className="px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-semibold text-slate-300 rounded-xl transition-colors disabled:opacity-40"
            >
              Previous
            </button>
            {currentIdx < questions.length - 1 ? (
              <button
                onClick={() => setCurrentIdx(currentIdx + 1)}
                className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-md shadow-cyan-950/40 flex items-center gap-1.5"
              >
                Next Question <ArrowIcon className="w-3.5 h-3.5"/>
              </button>
            ) : (
              <button
                onClick={handleSubmitQuiz}
                className="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-xl transition-all shadow-lg shadow-emerald-950/50 flex items-center gap-1.5"
              >
                Submit & Record Score <CheckCircle2Icon className="w-4 h-4"/>
              </button>
            )}
          </div>
        </div>
      ) : (
        <div className="space-y-6">
          <div className="border border-slate-800 bg-[#090d18] rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="flex items-center gap-5">
              <div className="w-16 h-16 rounded-2xl bg-cyan-950/80 border border-cyan-800/80 flex flex-col items-center justify-center shrink-0">
                <span className="text-2xl font-black text-cyan-300">{score}</span>
                <span className="text-[10px] text-slate-400 font-mono">/ 10</span>
              </div>
              <div>
                <h3 className="text-base font-bold text-white">
                  {score >= 8 ? `${selectedTech} Benchmark Cleared (+6 Readiness!)` : "Sprint Completed (+4 Readiness)"}
                </h3>
                <p className="text-xs text-slate-400 mt-1">Accuracy: {score * 10}%. Added to your daily practice streak.</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={copyResults}
                className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-300 rounded-xl transition-colors flex items-center gap-1.5"
              >
                <CopyIcon className="w-3.5 h-3.5" />
                {copiedSummary ? "Copied!" : "Share Results"}
              </button>
              <button
                onClick={() => { setSelectedAnswers({}); setFlaggedQuestions({}); setIsSubmitted(false); setCurrentIdx(0); }}
                className="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-white rounded-xl transition-colors"
              >
                Retake
              </button>
              <button
                onClick={handleLoadNextTenQuestions}
                className="px-5 py-2 bg-gradient-to-r from-cyan-500 to-emerald-400 hover:opacity-90 text-slate-950 font-extrabold text-xs rounded-xl transition-all shadow-lg shadow-cyan-950/50 flex items-center gap-1.5"
              >
                Practice 10 New Qs <RefreshCwIcon className="w-3.5 h-3.5"/>
              </button>
            </div>
          </div>

          <div className="space-y-4">
            {questions.map((q, idx) => {
              const userAns = selectedAnswers[idx];
              const isCorrect = userAns === q.correct;
              return (
                <div key={idx} className="border border-slate-800 bg-[#090d18] rounded-2xl p-5 space-y-3">
                  <div className="flex items-start justify-between gap-3">
                    <h4 className="text-sm font-bold text-white leading-snug">{idx + 1}. {q.q}</h4>
                    <span className={`text-[10px] font-mono px-2 py-0.5 rounded uppercase font-bold shrink-0 ${
                      isCorrect ? "bg-emerald-950 text-emerald-300 border border-emerald-800" : "bg-rose-950 text-rose-300 border border-rose-800"
                    }`}>
                      {isCorrect ? "Correct" : "Incorrect"}
                    </span>
                  </div>

                  <div className="space-y-1 text-xs">
                    <div className="text-slate-400">
                      Your Choice: <span className={isCorrect ? "text-emerald-400 font-semibold" : "text-rose-400 font-semibold line-through"}>
                        {userAns !== undefined ? q.options[userAns] : "Not answered"}
                      </span>
                    </div>
                    {!isCorrect && (
                      <div className="text-emerald-400 font-semibold">Correct Answer: {q.options[q.correct]}</div>
                    )}
                  </div>

/* ---------- 6. Resume Defender View ---------- */
function Defender({ analysis, onCompleteSprint }) {
  const norm = normalizeAnalysis(analysis);
  const targetBullet = norm.highlightedBullet;
  const [messages, setMessages] = useState([]);
  const [userInput, setUserInput] = useState("");
  const [isAiThinking, setIsAiThinking] = useState(false);

  useEffect(() => {
    async function initInterviewer() {
      setIsAiThinking(true);
      try {
        const question = await callGemini([
          {
            parts: [{
              text: `You are an aggressive Staff Interviewer at a Tier-1 tech company evaluating a candidate for: "${norm.targetRole}".
Their resume bullet: "${targetBullet}".
Ask ONE sharp question challenging their tools, implementation details, or scale.`
            }]
          }
        ]);
        setMessages([{ role: "ai", text: question }]);
      } catch (err) {
        setMessages([{
          role: "ai",
          text: `I see on your resume you claim: "${targetBullet}". What specific profiling or instrumentation tools did you use, and how did you measure trade-offs?`
        }]);
      } finally {
        setIsAiThinking(false);
      }
    }
    initInterviewer();
  }, [targetBullet, norm.targetRole]);

  const sendAnswer = async (answerText) => {
    const textToSend = answerText || userInput;
    if (!textToSend.trim() || isAiThinking) return;

    const newMsgs = [...messages, { role: "user", text: textToSend }];
    setMessages(newMsgs);
    setUserInput("");
    setIsAiThinking(true);

    try {
      const response = await callGemini(
        [{
          parts: [{
            text: `Target Role: "${norm.targetRole}"
Claim: "${targetBullet}"
Interviewer: "${messages[messages.length - 1]?.text}"
Candidate response: "${textToSend}"

Evaluate strictly. If ungrounded or lacking metrics, mark isFluff=true, give score <= 3. Format as JSON:
{
  "critique": string,
  "isFluff": boolean,
  "scoreOutOf10": number,
  "starGuidance": string
}`
          }]
        }],
        "You are a rigorous Staff Interviewer. Output valid JSON only.",
        true
      );

      setMessages([...newMsgs, {
        role: "ai",
        badge: response.isFluff,
        score: response.scoreOutOf10,
        text: response.critique,
        star: response.starGuidance
      }]);
      onCompleteSprint("defender", 3);
    } catch (err) {
      setMessages([...newMsgs, {
        role: "ai",
        badge: true,
        score: 3,
        text: "That explanation lacks production metrics. Specify the exact profiling tools, throughput change, and error rate impact."
      }]);
      onCompleteSprint("defender", 2);
    } finally {
      setIsAiThinking(false);
    }
  };

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 h-screen">
      <div className="border-r border-slate-800 p-8 overflow-y-auto bg-[#070a12]">
        <div className="text-xs text-slate-500 mb-4 font-mono">Parsed Experience Record</div>
        <div className="border border-slate-800 rounded-2xl p-6 bg-slate-900/40 space-y-3.5 text-sm leading-relaxed text-slate-400">
          <div className="text-white font-bold text-base">{norm.name}</div>
          <div className="text-xs text-slate-500">Target Track: {norm.targetRole}</div>
          <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200">
            <div className="text-[10px] text-amber-400 uppercase tracking-wider font-bold mb-1">Target Claim Under Cross-Examination:</div>
            • {targetBullet}
          </div>
          <p>The Staff Interviewer will scrutinize every word of this statement for vague terminology and ungrounded achievements.</p>
        </div>
      </div>

      <div className="flex flex-col h-screen bg-[#05070d]">
        <div className="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-sm font-bold text-white">Resume Defender</div>
            <div className="text-xs text-rose-400 font-medium">Hostile Interviewer Mode (+3 Readiness per defense)</div>
          </div>
          <div className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"/>
        </div>

        <div className="flex-1 overflow-y-auto px-6 py-5 space-y-4">
          {messages.map((m, i) => (
            <div key={i} className={`rise flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
              <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                m.role === "user" ? "bg-slate-800 text-white" : "bg-slate-900 border border-slate-800 text-slate-300"
              }`}>
                {m.badge && (
                  <div className="flex items-center gap-1.5 text-rose-400 text-xs font-bold mb-2">
                    <BadgeXIcon className="w-3.5 h-3.5"/>Fluff Detected (Score: {m.score}/10)
                  </div>
                )}
                {m.text}
                {m.star && (
                  <div className="mt-2.5 pt-2 border-t border-slate-800 text-xs text-cyan-300">
                    <strong>STAR Direction:</strong> {m.star}
                  </div>
                )}
              </div>
            </div>
          ))}
          {isAiThinking && (
            <div className="flex justify-start">
              <div className="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 flex gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-slate-500 dot1"/>
                <span className="w-1.5 h-1.5 rounded-full bg-slate-500 dot2"/>
                <span className="w-1.5 h-1.5 rounded-full bg-slate-500 dot3"/>
              </div>
            </div>
          )}
        </div>

        <div className="border-t border-slate-800 p-4 space-y-2">
          <button
            onClick={() => sendAnswer("I used standard practices and expanded our cluster allocation.")}
            className="w-full text-left text-xs border border-slate-800 hover:border-cyan-500/40 rounded-xl px-3.5 py-2.5 text-slate-400 hover:text-slate-200 transition-colors flex items-center justify-between"
          >
            <span>[Test Fluffy Answer]: "I used standard practices and expanded our cluster allocation."</span>
            <ArrowIcon className="w-3.5 h-3.5"/>
          </button>
          <div className="flex gap-2">
            <input
              type="text"
              value={userInput}
              onChange={e => setUserInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && sendAnswer()}
              placeholder="Defend your decisions with metrics and tooling..."
              className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
            />
            <button onClick={() => sendAnswer()} className="px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl transition-colors">
              Submit
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- 7. Commute Mode View ---------- */
function CommuteMode({ analysis, onCompleteSprint }) {
  const norm = normalizeAnalysis(analysis);
  const [sessionState, setSessionState] = useState('prompt');
  const [transcript, setTranscript] = useState("");
  const [critiqueData, setCritiqueData] = useState(null);
  const [isProcessing, setIsProcessing] = useState(false);
  const recognitionRef = useRef(null);

  const scenarioPrompt = norm.track === "non-tech"
    ? "Explain how you handle a 12% drop in core checkout conversion after a major UI redesign."
    : `Explain how you architect high-availability and zero-downtime rollouts in ${norm.primaryTech}.`;

  useEffect(() => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "en-US";
      rec.onresult = (e) => {
        let current = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          current += e.results[i][0].transcript;
        }
        setTranscript(current);
      };
      recognitionRef.current = rec;
    }
  }, []);

  const startListening = () => {
    setSessionState('recording');
    setTranscript("");
    try { recognitionRef.current?.start(); } catch (e) {}
  };

  const stopListening = async () => {
    try { recognitionRef.current?.stop(); } catch (e) {}
    setSessionState('feedback');
    setIsProcessing(true);

    const spokenText = transcript.trim() || "Basically, um, we use canary deployments, like, with ingress traffic routing so, uh, if an issue happens we roll back, you know.";
    setTranscript(spokenText);

    try {
      const evaluation = await callGemini(
        [{
          parts: [{
            text: `Candidate answered: '${scenarioPrompt}'.
Candidate spoken response: "${spokenText}".
Analyze verbal delivery and technical content. Count verbal filler words (um, uh, like, you know). Score delivery out of 10.
Return JSON:
{
  "fillerCount": number,
  "speechHygieneCritique": string,
  "technicalCritique": string,
  "deliveryScore": number
}`
          }]
        }],
        "You are an executive speaking coach. Output JSON only.",
        true
      );
      setCritiqueData(evaluation);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(evaluation.speechHygieneCritique));
      }
      onCompleteSprint("commute", 3);
    } catch (err) {
      setCritiqueData({
        fillerCount: 4,
        speechHygieneCritique: "High filler frequency detected ('um', 'like', 'uh', 'you know'). Replace hesitations with a 1-second silent pause.",
        technicalCritique: `Good high-level mention of canary patterns in ${norm.primaryTech}. Dive deeper into metrics-based automated rollbacks.`,
        deliveryScore: 7.2
      });
      onCompleteSprint("commute", 3);
    } finally {
      setIsProcessing(false);
    }
  };

  return (
    <div className="min-h-screen flex flex-col justify-between p-8 max-w-4xl mx-auto rise">
      <div className="flex items-center justify-between border-b border-slate-800 pb-4">
        <div className="flex items-center gap-2">
          <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
          <span className="text-xs font-bold uppercase tracking-wider text-emerald-400">
            Commute Mode · Live Voice Lab (+3 Readiness)
          </span>
        </div>
        <span className="text-xs text-slate-500 font-mono">Web Speech API</span>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center my-8 text-center max-w-2xl mx-auto w-full">
        <div className="mb-10 w-full">
          <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-semibold mb-4">
            <Volume2Icon className="w-3.5 h-3.5" /> Scenario Drill: {norm.targetRole}
          </div>
          <h2 className="text-2xl md:text-3xl font-extrabold text-white tracking-tight leading-snug">
            "{scenarioPrompt}"
          </h2>
          <p className="text-xs text-slate-400 mt-2">
            Speak into your microphone. Gemini evaluates filler words and architectural correctness.
          </p>
        </div>

        {sessionState === 'recording' && (
          <div className="mb-8 flex items-center justify-center gap-1.5 h-16">
            {[0.4, 0.7, 0.2, 0.9, 0.5, 0.8, 0.3, 0.95, 0.6, 0.4, 0.85, 0.5, 0.3].map((delay, idx) => (
              <div key={idx} className="audio-bar w-1.5 bg-gradient-to-t from-cyan-500 to-emerald-400 rounded-full"
                   style={{ animationDelay: `${delay}s`, height: `${Math.max(10, delay * 44)}px` }} />
            ))}
          </div>
        )}

        {sessionState !== 'feedback' && (
          <div className="flex flex-col items-center gap-3">
            <button
              onMouseDown={startListening}
              onMouseUp={stopListening}
              onTouchStart={startListening}
              onTouchEnd={stopListening}
              className={`w-28 h-28 rounded-full flex flex-col items-center justify-center transition-all duration-200 select-none shadow-2xl ${
                sessionState === 'recording'
                  ? 'bg-rose-500 scale-105 ring-8 ring-rose-500/20'
                  : 'bg-emerald-500 hover:bg-emerald-400 hover:scale-105 ring-8 ring-emerald-500/10'
              }`}
            >
              <MicIcon className={`w-8 h-8 ${sessionState === 'recording' ? 'text-white animate-pulse' : 'text-slate-950 font-bold'}`} />
              <span className={`text-[10px] font-bold mt-1 tracking-tight ${sessionState === 'recording' ? 'text-white' : 'text-slate-950'}`}>
                {sessionState === 'recording' ? 'Release to Send' : 'Hold to Speak'}
              </span>
            </button>
            <div className="text-xs text-slate-400">
              {sessionState === 'recording' ? (transcript || 'Listening…') : 'Press & hold to speak your answer'}
            </div>
          </div>
        )}

        {sessionState === 'feedback' && (
          <div className="w-full space-y-4 text-left rise">
            <div className="bg-[#090d18] border border-slate-800 rounded-2xl p-5">
              <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center justify-between">
                <span>Recognized Speech Transcript</span>
                {critiqueData && (
                  <span className="text-[10px] text-amber-400 font-mono font-bold">
                    {critiqueData.fillerCount || 0} Filler Words Detected
                  </span>
                )}
              </div>
              <p className="text-sm text-slate-200 leading-relaxed">"{transcript}"</p>
            </div>

            {isProcessing ? (
              <div className="p-6 bg-[#090d18] border border-slate-800 rounded-2xl flex items-center justify-center gap-2 text-xs text-cyan-300">
                <span className="w-2 h-2 rounded-full bg-cyan-400 dot1"/>
                <span className="w-2 h-2 rounded-full bg-cyan-400 dot2"/>
                Gemini analyzing speech hygiene and domain depth...
              </div>
            ) : critiqueData && (
              <div className="bg-[#090d18] border border-emerald-500/30 rounded-2xl p-5 shadow-xl space-y-3">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <SparklesIcon className="w-4 h-4 text-emerald-400" />
                    <span className="text-xs font-bold text-white uppercase tracking-wider">Gemini Audio Critique</span>
                  </div>
                  <div className="px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold font-mono">
                    Delivery Score: {critiqueData.deliveryScore || 7.2}/10
                  </div>
                </div>

                <div className="space-y-2 text-xs text-slate-300">
                  <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800 text-[11px]">
                    <strong className="text-rose-400">Speech Hygiene: </strong>
                    {critiqueData.speechHygieneCritique}
                  </div>
                  <div>
                    <strong className="text-cyan-300">Domain Depth: </strong>
                    {critiqueData.technicalCritique}
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800 flex justify-end">
                  <button onClick={() => setSessionState('prompt')} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-xl transition-colors flex items-center gap-1.5">
                    Next Scenario <ArrowIcon className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="border-t border-slate-800/80 pt-4 flex items-center justify-between text-xs text-slate-500">
        <span>Runs locally on Web Speech API</span>
        <span>SpeechSynthesis audio feedback enabled</span>
      </div>
    </div>
  );
}

              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
          </button>

          <button
            onClick={onGuestSignIn}
            className="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs rounded-xl border border-slate-700 transition-colors"
          >
            Instant Developer / Guest Sign-In
          </button>
        </div>

        <button onClick={onClose} className="w-full text-center text-xs text-slate-500 hover:text-slate-400 pt-2 block">
          Cancel
        </button>
      </div>
    </div>
  );
}

function ApiKeyModal({ isOpen, onClose }) {
  const [keyInput, setKeyInput] = useState(localStorage.getItem("prepstack_custom_gemini_key") || "");
  const [savedSuccess, setSavedSuccess] = useState(false);

  if (!isOpen) return null;

  const handleSave = () => {
    if (keyInput.trim()) {
      localStorage.setItem("prepstack_custom_gemini_key", keyInput.trim());
    } else {
      localStorage.removeItem("prepstack_custom_gemini_key");
    }
    setSavedSuccess(true);
    setTimeout(() => {
      setSavedSuccess(false);
      onClose();
    }, 1200);
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="max-w-md w-full bg-[#090d18] border border-slate-800 rounded-2xl p-6 space-y-4 rise shadow-2xl">
        <div className="text-center">
          <div className="w-10 h-10 rounded-xl bg-cyan-950 border border-cyan-800 flex items-center justify-center mx-auto text-cyan-400 mb-2">
            <KeyIcon className="w-5 h-5"/>
          </div>
          <h3 className="text-base font-bold text-white">Gemini API Key Configuration</h3>
          <p className="text-xs text-slate-400 mt-1">Configure your Google AI Studio API key. Saved securely in your browser's local storage.</p>
        </div>

        <div className="space-y-3">
          <input
            type="password"
            value={keyInput}
            onChange={e => setKeyInput(e.target.value)}
            placeholder="AIzaSy... (leave blank to use default key)"
            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
          />
          <div className="text-[11px] text-slate-500 leading-relaxed">
            Get your key from <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="text-cyan-400 underline">Google AI Studio</a>.
          </div>
        </div>

        <div className="flex gap-2 pt-2">
          <button onClick={onClose} className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300 rounded-xl border border-slate-700">
            Cancel
          </button>
          <button onClick={handleSave} className="flex-1 py-2 bg-cyan-500 hover:bg-cyan-400 text-xs font-bold text-slate-950 rounded-xl">
            {savedSuccess ? "Saved!" : "Save Key"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Master App Controller ---------- */
function App() {
  const [view, setView] = useState("onboarding");
  const [analysis, setAnalysis] = useState(DEFAULT_PERSONAS[0]);
  const [user, setUser] = useState(null);
  const [isAuthOpen, setIsAuthOpen] = useState(false);
  const [isApiKeyOpen, setIsApiKeyOpen] = useState(false);

  const [readinessScore, setReadinessScore] = useState(68);
  const [activityLog, setActivityLog] = useState({});
  const [currentStreak, setCurrentStreak] = useState(1);

  useEffect(() => {
    const savedLog = localStorage.getItem("prepstack_activity_log");
    const savedScore = localStorage.getItem("prepstack_readiness_score");
    const savedAnalysis = localStorage.getItem("prepstack_analysis_data");

    if (savedLog) {
      try { setActivityLog(JSON.parse(savedLog)); } catch (e) {}
    }
    if (savedScore) {
      setReadinessScore(Number(savedScore));
    }
    if (savedAnalysis) {
      try {
        const parsed = JSON.parse(savedAnalysis);
        setAnalysis(normalizeAnalysis(parsed));
      } catch (e) {}
    }

    if (auth) {
      const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
        setUser(currentUser);
        if (currentUser && db) {
          try {
            const docRef = db.collection("users").doc(currentUser.uid);
            const doc = await docRef.get();
            if (doc.exists) {
              const data = doc.data();
              if (data.readinessScore) setReadinessScore(data.readinessScore);
              if (data.activityLog) setActivityLog(data.activityLog);
              if (data.analysis) setAnalysis(normalizeAnalysis(data.analysis));
            }
          } catch (e) {
            console.warn("Firestore sync notice:", e);
          }
        }
      });
      return () => unsubscribe();
    }
  }, []);

  useEffect(() => {
    let streak = 0;
    const todayStr = getTodayString();
    
    let d = new Date();
    if (!activityLog[todayStr]) {
      d.setDate(d.getDate() - 1);
    }

    while (true) {
      const checkStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
      if (activityLog[checkStr] && activityLog[checkStr] > 0) {
        streak++;
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    setCurrentStreak(Math.max(1, streak));
  }, [activityLog]);

  const handleCompleteSprint = (sprintType, pointsEarned = 3) => {
    const todayStr = getTodayString();
    const updatedCount = (activityLog[todayStr] || 0) + 1;
    const updatedLog = { ...activityLog, [todayStr]: updatedCount };
    const newScore = Math.min(100, readinessScore + pointsEarned);

    setActivityLog(updatedLog);
    setReadinessScore(newScore);

    localStorage.setItem("prepstack_activity_log", JSON.stringify(updatedLog));
    localStorage.setItem("prepstack_readiness_score", String(newScore));

    if (user && db) {
      try {
        db.collection("users").doc(user.uid).set({
          readinessScore: newScore,
          activityLog: updatedLog,
          lastActivity: todayStr,
          analysis: analysis
        }, { merge: true });
      } catch (e) {}
    }
  };

  const handleOnboardingComplete = (data) => {
    const norm = normalizeAnalysis(data);
    setAnalysis(norm);
    setReadinessScore(norm.readinessScore);
    localStorage.setItem("prepstack_analysis_data", JSON.stringify(norm));
    setView("dashboard");
    handleCompleteSprint("onboarding", 2);
  };

  const handleGoogleSignIn = async () => {
    try {
      if (auth) {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        setIsAuthOpen(false);
      } else {
        handleGuestSignIn();
      }
    } catch (e) {
      handleGuest} else {
        handleGuestSignIn();
      }
    } catch (e) {
      handleGuestSignIn();
    }
  };

  const handleGuestSignIn = () => {
    const mockUser = {
      uid: "guest_" + Date.now(),
      displayName: analysis.name || "Aryan Mani",
      email: "engineer@prepstack.dev"
    };
    setUser(mockUser);
    setIsAuthOpen(false);
  };

  const handleSignOut = async () => {
    try { if (auth) await auth.signOut(); } catch (e) {}
    setUser(null);
  };

  return (
    <ErrorBoundary>
      <AuthModal
        isOpen={isAuthOpen}
        onClose={() => setIsAuthOpen(false)}
        onGoogleSignIn={handleGoogleSignIn}
        onGuestSignIn={handleGuestSignIn}
      />

      <ApiKeyModal
        isOpen={isApiKeyOpen}
        onClose={() => setIsApiKeyOpen(false)}
      />

      {view === "onboarding" ? (
        <Onboarding onComplete={handleOnboardingComplete} onOpenApiKeyModal={() => setIsApiKeyOpen(true)} />
      ) : (
        <Shell
          active={view}
          setView={setView}
          onReplay={() => setView("onboarding")}
          analysis={analysis}
          user={user}
          onSignIn={() => setIsAuthOpen(true)}
          onSignOut={handleSignOut}
          onOpenApiKeyModal={() => setIsApiKeyOpen(true)}
        >
          {view === "dashboard" && (
            <Dashboard
              analysis={analysis}
              readinessScore={readinessScore}
              activityLog={activityLog}
              currentStreak={currentStreak}
              setView={setView}
            />
          )}
          {view === "practice" && <PracticeMode analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
          {view === "star" && <StarStudio analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
          {view === "defender" && <Defender analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
          {view === "commute" && <CommuteMode analysis={analysis} onCompleteSprint={handleCompleteSprint} />}
        </Shell>
      )}
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
